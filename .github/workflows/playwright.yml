name: Playwright Tests

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pytest playwright pytest-playwright
          python -m playwright install --with-deps

      - name: Create cred.json file
        run: |
          mkdir -p data
          cat > data/credentials.json <<EOF
          {
            "user_credentials": [
              {
                "user_email": "${{ secrets.USER1_EMAIL }}",
                "user_password": "${{ secrets.USER1_PASSWORD }}"
              },
              {
                "user_email": "${{ secrets.USER2_EMAIL }}",
                "user_password": "${{ secrets.USER2_PASSWORD }}"
              }
            ]
          }
          EOF

      - name: Run tests
        run: |
          python -m pytest